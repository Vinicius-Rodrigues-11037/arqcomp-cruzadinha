<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memória da Arquitetura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Memória da Arquitetura</h1>
    <p>Vire duas cartas: combine cada sigla com a descrição dela.</p>
  </header>

  <main>
    <div class="painel">
      <span id="pares">0 de 10 pares</span>
      <span id="tentativas">0 tentativas</span>
      <button id="reiniciar" type="button">Reiniciar</button>
    </div>

    <section id="tabuleiro" aria-label="Tabuleiro do jogo da memória"></section>

    <p id="mensagem" role="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
